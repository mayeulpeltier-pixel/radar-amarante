# Blueprint Render : deploiement AUTOMATIQUE de l'application web du radar a
# chaque commit sur la branche principale. Plan gratuit : l'instance s'endort
# apres 15 min d'inactivite et se reveille en ~30-60 s au premier acces
# (acceptable pour un outil interne ; un plan paye supprimera ce delai le
# jour ou des clients l'utilisent).
#
# MISE EN ROUTE (une fois) :
#   1. render.com -> New -> Blueprint -> connecter le depot GitHub.
#   2. Render lit ce fichier et cree le service.
#   3. Renseigner les deux secrets demandes (sync: false) :
#        DATABASE_URL            = la meme chaine Neon que le secret GitHub
#        RADAR_APP_MOT_DE_PASSE  = le mot de passe d'acces au dashboard
#   4. L'URL fournie par Render sert la page ; identifiant : "radar".
services:
  - type: web
    name: radar-amarante
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn radar_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /sante
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RADAR_APP_MOT_DE_PASSE
        sync: false
      - key: RADAR_APP_UTILISATEUR
        value: radar

name: Sonde BODACC (jetable)

# Sonde jetable (01/11/2026) : mesure la part d'ETI / grands groupes dans les
# procedures collectives et cessions BODACC (arbitrage du seuil de taille du
# futur collecteur). Lecture seule, aucun secret. A supprimer apres decision.
on:
  workflow_dispatch:

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sonder BODACC x taille
        run: python sonde_bodacc_ie.py

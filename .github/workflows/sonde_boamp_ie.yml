name: Sonde BOAMP IE (IE-0)
# Diagnostic ponctuel, DECLENCHEMENT MANUEL UNIQUEMENT (workflow_dispatch).
# Ne touche a RIEN : ni Google Sheet, ni Postgres, ni etat, ni dashboard.
# N'appelle AUCUN LLM (cout zero). Repond a cinq questions avant de decider
# de construire le collecteur BOAMP IE (chantier IE-4) :
#   1. volume d'avis IE sur la fenetre (avis de marche / resultats) ;
#   2. part de bruit (sondages, statistiques, tourisme) ;
#   3. rappel sur la verite terrain (AURA 24-80762 et 24-39524, Nice 24-99592) ;
#   4. titulaires des marches IE attribues (carte concurrentielle) ;
#   5. codes CPV sous lesquels ces marches sont publies.
# Verdicts possibles : FAISABLE, MARGINAL, INFAISABLE, LEXIQUE A REVOIR,
# NON CONCLU (echantillon vide : pas un verdict).
#
# UTILISATION : Actions > "Sonde BOAMP IE (IE-0)" > Run workflow.
# RESULTAT : resume de l'execution (onglet Summary) + artefact
# "sonde-boamp-ie" (rapport.md, avis.csv) a telecharger en bas de la page.
on:
  workflow_dispatch:
    inputs:
      mois:
        description: "Profondeur en mois (defaut 32, couvre les references 2024)"
        required: false
        default: "32"
      max_par_terme:
        description: "Avis lus max par terme (defaut 1000)"
        required: false
        default: "1000"
jobs:
  sonde-boamp-ie:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances radar
        run: pip install -r requirements-radar.txt
      - name: Sonder le BOAMP sur le lexique IE
        env:
          SONDE_MOIS: ${{ github.event.inputs.mois }}
          SONDE_MAX_PAR_TERME: ${{ github.event.inputs.max_par_terme }}
          SONDE_SORTIE: sonde_boamp_ie_sortie
        run: python sonde_boamp_ie.py
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonde-boamp-ie
          path: sonde_boamp_ie_sortie/
          if-no-files-found: warn
          retention-days: 30

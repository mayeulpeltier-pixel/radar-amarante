name: Sonde sources

# Diagnostic ponctuel, DECLENCHEMENT MANUEL UNIQUEMENT (workflow_dispatch).
# Ne touche a rien : ni Google Sheet, ni Postgres, ni etat, ni dashboard, ni
# publication. Son unique role est de repondre a la question "cette source
# est-elle accessible depuis l'infra GitHub Actions ?" AVANT d'ecrire un
# collecteur. Deux precedents justifient cette discipline :
#   - ADB  : 403 puis portail rendu en JavaScript, collecteur inutile ;
#   - UNGM : deux tours perdus faute d'avoir dumpe le HTML brut d'emblee.
#
# CIBLE ACTUELLE (22/07/2026) : IDB / BID, la Banque interamericaine de
# developpement. C'est le bailleur principal d'Amerique latine, region ouverte
# ce jour dans le perimetre commercial, et pour laquelle aucune source
# REGIONALE n'existe (equivalent de l'AfDB pour l'Afrique).
#
# UTILISATION : onglet Actions > "Sonde sources" > Run workflow.
# Puis lire le journal de l'etape "Sonder l'IDB", notamment la SYNTHESE finale.
#
# Une sonde est JETABLE : une fois le verdict obtenu et le collecteur ecrit
# (ou la source abandonnee), le fichier sonde_*.py correspondant peut etre
# supprime du depot. Aucun autre fichier n'en depend.

on:
  workflow_dispatch:

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        # Versions FIGEES depuis le fichier commun (23/07/2026), comme les
        # quatre autres workflows : une seule source de verite.
        #
        # NOTE : l'extra `http2` a disparu. Il servait a tester une empreinte
        # TLS differente de requests contre le pare-feu applicatif de l'IDB ;
        # la variante retenue au final n'utilise pas httpx, et plus aucune
        # sonde ne l'importe. httpx reste installe (la suite de tests en a
        # besoin pour fastapi.testclient), mais sans l'extra.
        run: pip install -r requirements-radar.txt

      - name: Sonder l'IDB (autopsie du blocage et contournements)
        run: python sonde_idb.py

      # CIBLE 23/07/2026 : alertes voyageurs FCDO (UK). Premiere brique de la
      # veille "signaux faibles" (avant ACLED et projets industriels). API
      # GOV.UK Content, JSON public, sans cle, Open Government Licence v3.0.
      # La sonde derive la liste des pays du perimetre radar (option A) et
      # revele : ou vit alert_status, sous quelle forme, et quels pays du
      # perimetre ont un slug FCDO. Aucune ecriture. Lire la SYNTHESE finale.
      - name: Sonder les alertes voyageurs FCDO
        run: python sonde_alertes.py

name: Sonde sources

# Diagnostic ponctuel, DECLENCHEMENT MANUEL UNIQUEMENT (workflow_dispatch).
# Ne touche a rien : ni Google Sheet, ni Postgres, ni etat, ni dashboard, ni
# publication. Son role est de valider une source AVANT d'ecrire/activer un
# collecteur. Precedents qui justifient cette discipline :
#   - ADB  : 403 puis portail rendu en JavaScript, collecteur inutile ;
#   - UNGM : deux tours perdus faute d'avoir dumpe le brut d'emblee.
#
# CIBLE ACTUELLE (26/07/2026) : MESURE DE L'ENTONNOIR PROZORRO (Option A).
# La forme du brut a deja ete validee par sonde_prozorro.py (flux OK, detail
# exploitable, CPV standard, 100% cyrillique). Cette etape mesure maintenant le
# ROI : sur un echantillon d'1 JOUR, combien de details telecharges, combien
# survivent aux 3 cribles (methode, valeur, CPV), quel partage avis/attribution,
# quel temps par detail. On lance prozorro_radar.py en PROZORRO_DRY_RUN : aucun
# LLM, aucune ecriture, aucune memoire touchee. Lire l'ENTONNOIR PROZORRO dans
# le journal. Une fois le ROI valide, on retire le dry-run et on cable le
# collecteur dans le workflow radar principal.
#
# sonde_prozorro.py a fait son travail : il peut etre supprime du depot.
# FCDO (alertes voyageurs) : conservee tant que cette veille n'est pas
# finalisee ; la retirer une fois le collecteur alertes ecrit.
#
# UTILISATION : onglet Actions > "Sonde sources" > Run workflow.

on:
  workflow_dispatch:

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        # Versions FIGEES depuis le fichier commun : une seule source de verite.
        # Le collecteur Prozorro ne depend que de `requests` (deja present).
        run: pip install -r requirements-radar.txt

      # CIBLE ACTUELLE : aucune sonde Prozorro. Verdict rendu le 26/07/2026
      # (attributions 38/38 gagnants ukrainiens, 0 etranger -> source coupee,
      # cf. commentaire dans radar.yml). Les sondes sonde_prozorro.py et
      # sonde_prozorro_attributions.py sont supprimees (jetables, travail fait).
      # Prochaine cible a sonder : brancher ici le sonde_<source>.py voulu.

      # CIBLE ACTUELLE : aucune. MIGA valide en debug et cable en prod dans
      # radar.yml le 27/07/2026 (crible FI, resolution pays, dedup SPG/Brief).
      # sonde_miga.py supprimee (jetable). Prochaine cible a sonder : brancher
      # ici le sonde_<source>.py voulu.

      # Veille "signaux faibles" alertes voyageurs FCDO (UK). API GOV.UK
      # Content, JSON public, sans cle. A retirer une fois le collecteur ecrit.
      - name: Sonder les alertes voyageurs FCDO
        run: python sonde_alertes.py

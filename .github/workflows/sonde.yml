name: Sonde sources

# Diagnostic ponctuel, DECLENCHEMENT MANUEL UNIQUEMENT (workflow_dispatch).
# Ne touche a rien : ni Google Sheet, ni Postgres, ni etat, ni dashboard, ni
# publication. Son unique role est de repondre a la question "cette source
# est-elle accessible depuis l'infra GitHub Actions ?" AVANT d'ecrire un
# collecteur. Precedents qui justifient cette discipline :
#   - ADB  : 403 puis portail rendu en JavaScript, collecteur inutile ;
#   - UNGM : deux tours perdus faute d'avoir dumpe le HTML/JSON brut d'emblee.
#
# CIBLE ACTUELLE (26/07/2026) : PROZORRO, l'e-procurement public ukrainien.
# Zone COEUR du radar (reconstruction, deploiements massifs). Profil nouveau
# pour nous : gros volume, langue ukrainienne, flux de changements plutot que
# recherche plein-texte. On valide la forme du brut AVANT d'ecrire le
# collecteur. API publique confirmee : https://public-api.prozorro.gov.ua/api/2.5
#
# IsDB : etape retiree, diagnostic termine (filtre pays corrige, source
# integree). FCDO (alertes voyageurs) : conservee tant que cette veille n'est
# pas finalisee ; la retirer une fois le collecteur alertes ecrit.
#
# UTILISATION : onglet Actions > "Sonde sources" > Run workflow.
# Puis lire le journal de chaque etape, notamment la SYNTHESE finale de chacune.
#
# Une sonde est JETABLE : une fois le verdict obtenu et le collecteur ecrit
# (ou la source abandonnee), le fichier sonde_*.py correspondant peut etre
# supprime du depot. Aucun autre fichier n'en depend.

on:
  workflow_dispatch:

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        # Versions FIGEES depuis le fichier commun, comme les autres workflows :
        # une seule source de verite. La sonde Prozorro ne depend que de
        # `requests`, deja present dans requirements-radar.txt.
        run: pip install -r requirements-radar.txt

      # CIBLE 26/07/2026 : Prozorro (Ukraine). La sonde tranche, sans rien
      # ecrire ni appeler de LLM : (A) le flux repond et sa fraicheur/debit,
      # (B) le detail d'un avis -- champs exploitables, CPV au format qu'on sait
      # deja filtrer, part de titres cyrilliques, (C) si le mode OCDS simplifie
      # le parsing. Lire la SYNTHESE finale.
      - name: Sonder Prozorro (forme du brut avant collecteur)
        run: python sonde_prozorro.py

      # Veille "signaux faibles" alertes voyageurs FCDO (UK). API GOV.UK
      # Content, JSON public, sans cle. A retirer une fois le collecteur
      # alertes ecrit.
      - name: Sonder les alertes voyageurs FCDO
        run: python sonde_alertes.py

name: Sonde sources

# Diagnostic ponctuel, DECLENCHEMENT MANUEL UNIQUEMENT (workflow_dispatch).
# Ne touche a rien : ni Google Sheet, ni Postgres, ni etat, ni dashboard, ni
# publication. Son unique role est de repondre a la question "cette source
# est-elle accessible depuis l'infra GitHub Actions ?" AVANT d'ecrire un
# collecteur. Deux precedents justifient cette discipline :
#   - ADB  : 403 puis portail rendu en JavaScript, collecteur inutile ;
#   - UNGM : deux tours perdus faute d'avoir dumpe le HTML brut d'emblee.
#
# CIBLE ACTUELLE (22/07/2026) : IDB / BID, la Banque interamericaine de
# developpement. C'est le bailleur principal d'Amerique latine, region ouverte
# ce jour dans le perimetre commercial, et pour laquelle aucune source
# REGIONALE n'existe (equivalent de l'AfDB pour l'Afrique).
#
# UTILISATION : onglet Actions > "Sonde sources" > Run workflow.
# Puis lire le journal de l'etape "Sonder l'IDB", notamment la SYNTHESE finale.
#
# Une sonde est JETABLE : une fois le verdict obtenu et le collecteur ecrit
# (ou la source abandonnee), le fichier sonde_*.py correspondant peut etre
# supprime du depot. Aucun autre fichier n'en depend.

on:
  workflow_dispatch:

jobs:
  sonder:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dependances
        run: pip install requests

      - name: Sonder l'IDB (Banque interamericaine)
        run: python sonde_idb.py

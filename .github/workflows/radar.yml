name: Radar Amarante
# Quand le radar tourne :
#  - schedule : automatiquement, lundi ET jeudi a 06h00 UTC (08h00 Paris l'ete).
#  - workflow_dispatch : a la demande, depuis l'onglet Actions ou l'app mobile.
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

# Droit d'ecrire dans le depot : necessaire pour committer radar_etat.json
# (l'etat inter-runs, desormais decouple du Google Sheet).
permissions:
  contents: write

# Un seul run du radar a la fois : evite que deux executions (ex. un cron et un
# lancement manuel) ne se marchent dessus sur le fichier d'etat.
concurrency:
  group: radar-amarante
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install requests gspread google-auth python-dateutil pypdf
      # 1) Barriere de securite : les tests d'abord. Si un test casse, on s'arrete.
      - name: Lancer les tests
        run: python -m unittest test_radar -v
      # 2) Reconstituer la cle de service Google a partir du secret.
      - name: Reconstituer la cle de service Google
        run: echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json
      # 3) Lancer le radar (TED puis BM, ecriture dans le Sheet).
      - name: Lancer le radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          RADAR_LOG_FILE: radar.log
          RELIEFWEB_APPNAME: radar-amarante.pages.dev
          RADAR_GDELT: "0"
          RADAR_PRIVES_DEBUG: "1"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
        run: python radar_run.py
      # 3b) Sauvegarder l'etat inter-runs (curseur + articles vus) dans le depot.
      #     C'est ce qui remplace le stockage dans le Sheet (fin du SPOF).
      #     if: always() => on garde l'etat meme si une etape suivante echoue.
      #     [skip ci] => ce commit ne redeclenche pas le workflow.
      - name: Sauvegarder l'etat du radar
        if: always()
        run: |
          if [ -z "$(git status --porcelain radar_etat.json)" ]; then
            echo "Etat inchange, rien a committer."
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_etat.json
          git commit -m "chore(radar): etat inter-runs [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      # 4) Generer le tableau de bord depuis le Sheet (public/index.html).
      #    if: always() => le dashboard se rafraichit meme si le radar a eu un
      #    souci, en lisant le dernier etat du Sheet. L'echec radar reste visible
      #    (le job est marque en echec, alerte mail) mais la page reste a jour.
      - name: Generer le tableau de bord
        if: always()
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          DASHBOARD_OUTPUT: public/index.html
        run: python radar_dashboard.py
      # 5) Publier la page sur Cloudflare Pages (hebergement statique gratuit).
      - name: Publier sur Cloudflare Pages
        if: always()
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=radar-amarante
      # 6) Archiver le journal du run (90 jours), meme en cas d'echec.
      - name: Archiver le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-log
          path: radar.log
          retention-days: 90

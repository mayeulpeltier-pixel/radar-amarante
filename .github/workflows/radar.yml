name: Radar Amarante
# Quand le radar tourne :
#  - schedule : automatiquement, lundi ET jeudi a 06h00 UTC (08h00 Paris l'ete).
#  - workflow_dispatch : a la demande, depuis l'onglet Actions ou l'app mobile.
on:
  schedule:
    - cron: "0 6 * * 1,4"
  workflow_dispatch:

# Droit d'ecrire dans le depot : necessaire pour committer radar_etat.json
# (l'etat inter-runs, desormais decouple du Google Sheet).
permissions:
  contents: write

# Un seul run du radar a la fois : evite que deux executions (ex. un cron et un
# lancement manuel) ne se marchent dessus sur le fichier d'etat.
concurrency:
  group: radar-amarante
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    # 150 min : le temps d'absorber le retard d'analyse accumule (correction
    # de l'ordre plafond/memoire du 22/07/2026). Projection sur les cadences
    # reelles : ~85 min pour le premier run, quelques minutes ensuite. Le
    # timeout est un garde-fou, pas une duree : les runs normaux restent courts.
    timeout-minutes: 150
    # Variables communes a TOUTES les etapes du job.
    env:
      # BASCULE DE LA MEMOIRE INTER-RUNS (22/07/2026).
      # Les collecteurs lisent desormais dans Postgres ce qu'ils ont deja
      # traite, et ne consultent plus Google Sheets pour cela. Pose au niveau
      # du job pour couvrir toutes les etapes d'un coup.
      #
      # Decide APRES verification, pas a l'aveugle : la phase d'ombre a compare
      # les deux memoires sur plusieurs runs, et les six onglets etaient
      # identiques au caractere pres (ted 64, bm 292, afdb 103, ebrd 1099,
      # reliefweb 237, attributions 752). Elle a d'ailleurs intercepte au
      # passage une corruption de bm_radar que rien d'autre ne montrait.
      #
      # RETOUR EN ARRIERE : mettre "0" (ou retirer la ligne) et le Sheet
      # redevient la reference, sans autre changement. Si la base est
      # injoignable, le repli sur le Sheet est AUTOMATIQUE.
      RADAR_MEMOIRE: "pg"
      # ABSORPTION PONCTUELLE (22/07/2026) : 278 offres ReliefWeb attendaient
      # d'etre analysees, heritage de l'ordre plafond/memoire corrige ce jour.
      # 300 places pour vider la file en un run (~70 min d'analyse, le timeout
      # est a 150 min). A REMETTRE A 120 (ou a retirer) ensuite : le regime de
      # croisiere n'a plus besoin d'un tel budget.
      RELIEFWEB_BUDGET: "300"
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        # Versions FIGEES depuis un fichier unique (23/07/2026). Avant, chaque
        # run installait la derniere version publiee le matin meme : une
        # majeure cassante de gspread, psycopg ou pydantic un dimanche soir
        # suffisait a arreter la collecte du lundi, sans qu'une ligne du depot
        # ait bouge. Une seule source de verite pour les cinq workflows : un
        # paquet de plus installe ici coute quelques secondes, une version qui
        # derive coute un run.
        run: pip install -r requirements-radar.txt
      # 1) Barriere de securite : les tests d'abord. Si un test casse, on s'arrete.
      - name: Lancer les tests
        run: python -m unittest discover -p "test_*.py" -v
      # 2) Reconstituer la cle de service Google a partir du secret.
      #    `id: cle` : toutes les etapes qui ecrivent dans le Sheet s'y
      #    referent (voir la note VERROU CREDENTIALS plus bas).
      #    La verification qui suit evite un mode de panne desagreable : un
      #    secret absent ou tronque produisait un service_account.json vide,
      #    et chaque collecteur echouait ensuite avec une erreur d'analyse
      #    JSON, loin de la cause. Autant echouer ici, avec le bon message.
      - name: Reconstituer la cle de service Google
        id: cle
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json
          python - <<'PY'
          import json, sys
          try:
              with open("service_account.json", encoding="utf-8") as f:
                  cle = json.load(f)
          except Exception as e:
              sys.exit("Secret GOOGLE_SERVICE_ACCOUNT_JSON absent ou illisible : "
                       "{}".format(e))
          manquants = [c for c in ("type", "project_id", "private_key", "client_email")
                       if not cle.get(c)]
          if manquants:
              sys.exit("Cle de service incomplete, champs manquants : "
                       + ", ".join(manquants))
          print("cle de service valide ->", cle["client_email"])
          PY
      # 3) Lancer le radar (TED, BM, AfDB, ADB, EBRD, ReliefWeb, signaux prives).
      #    ADB_URL / EBRD_URL : optionnels. Non definis => les collecteurs
      #    utilisent leur URL par defaut (garde-fou si la page revient vide).
      - name: Lancer le radar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          RADAR_LOG_FILE: radar.log
          RELIEFWEB_APPNAME: amarante-radar-veille-x7q234hyu
          RADAR_GDELT: "0"
          RADAR_ADB: "0"          # ADB desactive : portail rendu en JS, 0 resultat depuis l'infra CI (meme logique que GDELT). Retirer cette ligne pour reactiver.
          RADAR_PRIVES_DEBUG: "0"
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python radar_run.py
      # 3b) Sauvegarder l'etat inter-runs (curseur + articles vus) dans le depot.
      #     C'est ce qui remplace le stockage dans le Sheet (fin du SPOF).
      #     if: always() => on garde l'etat meme si une etape suivante echoue.
      #     [skip ci] => ce commit ne redeclenche pas le workflow.
      - name: Sauvegarder l'etat du radar
        if: always()
        run: |
          if [ -z "$(git status --porcelain radar_etat.json)" ]; then
            echo "Etat inchange, rien a committer."
            exit 0
          fi
          git config user.name "radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_etat.json
          git commit -m "chore(radar): etat inter-runs [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      # ---------------------------------------------------------------------
      # VERROU CREDENTIALS (23/07/2026) -- pourquoi `steps.cle.outcome`
      # ---------------------------------------------------------------------
      # Les etapes ci-dessous portent `if: always()` pour une bonne raison :
      # un collecteur qui tombe ne doit pas empecher les suivants. Mais
      # `always()` veut dire TOUJOURS, y compris quand l'etape 2 a ete SAUTEE
      # parce que les tests avaient echoue. Constate le 23/07/2026 : un test
      # rouge a fait sauter la reconstitution de la cle, et sept etapes ont
      # quand meme demarre. IDB a lu 64 pages et 23 730 contrats avant de
      # mourir sur `FileNotFoundError: service_account.json`. Reseau, temps et
      # budget d'appels au modele depenses pour rien, et sept echecs en
      # cascade qui masquent la vraie cause en tete de journal.
      #
      # `steps.cle.outcome == 'success'` conserve l'isolation entre
      # collecteurs, et ajoute la seule condition qui manquait : ne rien
      # tenter d'ecrire sans credentials. Si les tests echouent, la cle est
      # sautee, son `outcome` vaut 'skipped', et aucune collecte ne demarre.
      # Le job reste rouge : c'est bien un echec, pas un run silencieux.
      # 4a) Attributions Banque Mondiale : titulaires nommes, en mobilisation.
      #     Ecrit dans le MEME onglet que les attributions TED, donc remonte
      #     automatiquement dans la lentille Titulaires et la fiche 360.
      #     Isole : un echec ici n'empeche ni le dashboard ni la publication.
      - name: Collecter les attributions Banque Mondiale
        if: always() && steps.cle.outcome == 'success'
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          # Mettre a 1 pour verifier les noms extraits SANS rien ecrire.
          RADAR_BM_ATTRIB_DEBUG: "0"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python bm_attributions.py

      # 4b) UNGM : avis des agences ONU (HCR, PAM, UNICEF, PNUD, OIM, UNOPS...),
      #     qui operent exactement dans les zones d'Amarante. Isole : un echec
      #     ici n'empeche ni le dashboard ni la publication.
      #     RADAR_UNGM_DEBUG=1 pour verifier le parsing sans rien ecrire.
      - name: Collecter les avis UNGM
        if: always() && steps.cle.outcome == 'success'
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_UNGM_DEBUG: "0"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ungm_radar.py

      # 4c) Attributions UNGM : titulaires nommes de marches ONU. Ecrit dans le
      #     MEME onglet que les attributions TED et BM, donc aucun cablage
      #     dashboard. L'endpoint reel (/PublicSearch) et la charge utile ont
      #     ete releves dans le JavaScript du portail le 20/07/2026.
      #     RADAR_UNGM_ATTRIB_DEBUG=1 pour verifier titulaires et structure
      #     sans rien ecrire. Enrichissement par fiche detaillee ETEINT : la
      #     fiche UNGM ne porte ni montant ni pays du fournisseur (verifie).
      - name: Collecter les attributions UNGM
        if: always() && steps.cle.outcome == 'success'
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          RADAR_UNGM_ATTRIB_DEBUG: "0"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python ungm_attributions.py

      # 4d) Attributions IsDB : la Banque islamique finance dans la zone
      #     d'Amarante (Mali, Mauritanie, Niger, Somalie, Soudan, Libye, Yemen,
      #     Togo, Sierra Leone, Mozambique, Tadjikistan). Sa fiche donne le NOM
      #     ET LE PAYS du titulaire, donc le filtre local/etranger fonctionne,
      #     contrairement a UNGM. Meme onglet : aucun cablage dashboard.
      #     RADAR_ISDB_DEBUG=1 pour verifier sans rien ecrire.
      # Nouvelle source : premiere couverture REGIONALE de l'Amerique latine.
      # Demarre en mode verification (RADAR_IDB_DEBUG=1) : aucune ecriture tant
      # que l'entonnoir et les valeurs distinctes n'ont pas ete valides sur
      # donnees reelles. Meme prudence que pour IsDB, qui avait revele un bug
      # de filtre pays avant toute ecriture.
      - name: Collecter les avis IDB (Amerique latine)
        if: always() && steps.cle.outcome == 'success'
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RADAR_IDB_DEBUG: "0"
          # Le jeu AVIS s'est revele FIGE (plus recent : 03/10/2025, aucun
          # 2026). On inspecte donc le jeu ATTRIBUTIONS, jamais examine :
          # un titulaire reste un prospect bien plus longtemps qu'un avis.
          RADAR_IDB_JEU: "attributions"
        run: python idb_radar.py

      - name: Collecter les attributions IsDB
        if: always() && steps.cle.outcome == 'success'
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          RADAR_ISDB_DEBUG: "0"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python isdb_radar.py

      # 5) Generer le tableau de bord depuis le Sheet (public/index.html).
      #    if: always() => le dashboard se rafraichit meme si un collecteur a eu
      #    un souci, en lisant le dernier etat du Sheet. L'echec reste visible
      #    (job en echec, alerte mail) mais la page reste a jour.
      - name: Generer le tableau de bord
        if: always() && steps.cle.outcome == 'success'
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          DASHBOARD_OUTPUT: public/index.html
          # SUIVI_* : active le bouton "Je contacte" (POST vers le webapp Apps
          # Script). Sans eux, le bouton ne s'affiche pas (dashboard intact).
          SUIVI_WEBAPP_URL: ${{ secrets.SUIVI_WEBAPP_URL }}
          SUIVI_TOKEN: ${{ secrets.SUIVI_TOKEN }}
        run: python radar_dashboard.py
      # 6) Digest hebdo push : envoie par e-mail les NOUVELLES opportunites "a
      #     contacter" (via le meme webapp Apps Script que le bouton "Je
      #     contacte"). Best-effort et isole : sans SUIVI_* il ne fait rien, et
      #     un echec ici n'affecte ni le radar ni la publication du dashboard.
      - name: Envoyer le digest hebdo
        if: always() && steps.cle.outcome == 'success'
        env:
          TED_SHEET_ID: ${{ secrets.TED_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          SUIVI_WEBAPP_URL: ${{ secrets.SUIVI_WEBAPP_URL }}
          SUIVI_TOKEN: ${{ secrets.SUIVI_TOKEN }}
        run: python radar_digest.py
      # 7) Publier la page sur Cloudflare Pages (hebergement statique gratuit).
      - name: Publier sur Cloudflare Pages
        if: always() && steps.cle.outcome == 'success'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=radar-amarante
      # 8) Archiver le journal du run (90 jours), meme en cas d'echec.
      - name: Archiver le journal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-log
          path: radar.log
          retention-days: 90

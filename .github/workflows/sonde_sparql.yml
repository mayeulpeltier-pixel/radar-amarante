name: Sonde SPARQL titulaires
on:
  workflow_dispatch:
    inputs:
      pub:
        description: "publication-number d'une attribution TED (ex 10759-2026)"
        required: false
        default: ""
jobs:
  sonde-sparql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer requests
        run: pip install requests
      - name: Sonder l endpoint SPARQL
        env:
          SONDE_PUB: ${{ github.event.inputs.pub }}
        run: python sonde_sparql.py

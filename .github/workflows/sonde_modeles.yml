name: Sonde migration modeles
# Diagnostic ponctuel, DECLENCHEMENT MANUEL UNIQUEMENT (workflow_dispatch).
# Ne touche a RIEN : ni Google Sheet, ni Postgres, ni etat, ni dashboard.
# Compare, sur de VRAIS avis TED, les modeles actuels (Haiku 4.5 / Sonnet 4.6)
# a leurs successeurs (Haiku 5.5 / Sonnet 5.5) : compatibilite de l'appel
# (temperature: 0), fiabilite du JSON, accord sur les decisions, cout mesure.
# Plafond de depense dur (SONDE_PLAFOND_USD). Sonde jetable : supprimer une
# fois la bascule decidee.
#
# UTILISATION : Actions > "Sonde migration modeles" > Run workflow.
# Lancer d'abord avec dryrun=1 (gratuit) pour voir l'echantillon.
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Nombre d'avis TED compares (defaut 25)"
        required: false
        default: "25"
      plafond:
        description: "Plafond de depense en dollars (defaut 3)"
        required: false
        default: "3"
      dryrun:
        description: "1 = echantillon + estimation, AUCUN appel modele"
        required: false
        default: "0"
      roles:
        description: "Sous-ensemble (ex volume_candidat), vide = les 4 modeles"
        required: false
        default: ""
      max_tokens:
        description: "Plafond de sortie par appel (defaut 1000, comme la production)"
        required: false
        default: "1000"
      verif_coeur:
        description: "1 = exercer le vrai chemin de production (coeur + lentille IE) sur 3 avis"
        required: false
        default: "0"
      export:
        description: "publication-numbers a figer (separes par des virgules), vide = non"
        required: false
        default: ""
      calibration:
        description: "Jeu de reference a rejouer (ex calibration_escalade.json), vide = non"
        required: false
        default: ""
jobs:
  sonde-modeles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances radar
        run: pip install -r requirements-radar.txt
      - name: Comparer les modeles
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SONDE_N: ${{ github.event.inputs.n }}
          SONDE_PLAFOND_USD: ${{ github.event.inputs.plafond }}
          SONDE_DRYRUN: ${{ github.event.inputs.dryrun }}
          SONDE_ROLES: ${{ github.event.inputs.roles }}
          SONDE_MAX_TOKENS: ${{ github.event.inputs.max_tokens }}
          SONDE_VERIF_COEUR: ${{ github.event.inputs.verif_coeur }}
          SONDE_EXPORT: ${{ github.event.inputs.export }}
          SONDE_CALIBRATION: ${{ github.event.inputs.calibration }}
        run: python sonde_modeles.py
      - name: Publier le detail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonde-modeles-resultats
          path: sonde_modeles_resultats.json
          if-no-files-found: ignore

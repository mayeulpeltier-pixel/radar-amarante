name: Radar IE (ARISE)
# Collecteur IE (chantier IE-4) : appels d'offres d'intelligence economique et
# de conformite publies au BOAMP, lus par la lentille IE, restitues a ARISE
# dans un classeur Google Sheet A PART (secret IE_SHEET_ID), jamais dans le
# Sheet Operations. Workflow SEPARE de radar.yml : un echec ici n'affecte pas
# la collecte Operations, et inversement.
#
# Quand : lundi et jeudi 06h40 UTC (apres le radar Operations), ou a la main.
#
# PREMIER LANCEMENT : Run workflow avec debug = 1. La collecte et le
# pre-filtre tournent, la file qui partirait au LLM s'affiche dans l'onglet
# Summary, et RIEN n'est ecrit ni facture. Relancer ensuite avec debug = 0.
#
# SECRETS : GOOGLE_SERVICE_ACCOUNT_JSON, ANTHROPIC_API_KEY, DATABASE_URL
# (deja en place) et IE_SHEET_ID (nouveau : identifiant du classeur ARISE,
# partage en Editeur avec l'adresse client_email du compte de service).
on:
  schedule:
    - cron: "40 6 * * 1,4"
  workflow_dispatch:
    inputs:
      debug:
        description: "1 = collecte et pre-filtre seulement, sans LLM ni ecriture"
        required: false
        default: "0"
      jours:
        description: "Fenetre de publication en jours (defaut 30)"
        required: false
        default: "30"

concurrency:
  group: radar-ie
  cancel-in-progress: false

jobs:
  radar-ie:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: pip install -r requirements-radar.txt
      # Barriere : les tests du volet IE d'abord. S'ils cassent, rien ne tourne.
      - name: Tester le volet IE
        run: python -m unittest test_lentille_ie test_collecteur_ie test_collecteur_international_ie test_echeances_ie test_declencheurs_ie test_dashboard_ie -v
      - name: Reconstituer la cle de service Google
        id: cle
        run: |
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > service_account.json
          python - <<'PY'
          import json, sys
          try:
              with open("service_account.json", encoding="utf-8") as f:
                  cle = json.load(f)
          except Exception as e:
              sys.exit("Secret GOOGLE_SERVICE_ACCOUNT_JSON absent ou illisible : {}".format(e))
          manquants = [c for c in ("type", "project_id", "private_key", "client_email")
                       if not cle.get(c)]
          if manquants:
              sys.exit("Cle de service incomplete : " + ", ".join(manquants))
          print("Partager le classeur ARISE avec :", cle["client_email"])
          PY
      - name: Collecter les appels d'offres IE
        if: steps.cle.outcome == 'success'
        env:
          RADAR_IE: "1"
          RADAR_IE_DEBUG: ${{ github.event.inputs.debug || '0' }}
          RADAR_IE_JOURS: ${{ github.event.inputs.jours || '30' }}
          RADAR_IE_BUDGET: "30"
          IE_SHEET_ID: ${{ secrets.IE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collecteur_ie.py
      # Collecteur IE INTERNATIONAL (IE-5) : lentille IE appliquee a TED (hors
      # France, deja couverte par le BOAMP) et a l'UNGM. Meme classeur, meme
      # table, meme onglet "Leads IE" que le BOAMP (colonne source TED/UNGM).
      - name: Collecter les appels d'offres IE internationaux
        if: always() && steps.cle.outcome == 'success'
        env:
          RADAR_IE: "1"
          RADAR_IE_DEBUG: ${{ github.event.inputs.debug || '0' }}
          RADAR_IE_INTL_JOURS: ${{ github.event.inputs.jours || '30' }}
          RADAR_IE_INTL_BUDGET: "20"
          IE_SHEET_ID: ${{ secrets.IE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python collecteur_international_ie.py
      # Declencheurs (IE-7) : CJIP financieres imposant un programme de
      # conformite sous controle de l'AFA. Source justice.gouv.fr, aucun LLM.
      - name: Collecter les declencheurs CJIP
        if: always() && steps.cle.outcome == 'success'
        env:
          RADAR_IE: "1"
          RADAR_IE_DEBUG: ${{ github.event.inputs.debug || '0' }}
          IE_SHEET_ID: ${{ secrets.IE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python declencheurs_ie.py
      # Echeances (IE-6) : marches IE deja attribues dont la fin approche, tires
      # des DECP consolidees (~230 Mo, Parquet). Aucun appel LLM. Isole : un
      # echec ici n'annule pas les leads ecrits a l'etape precedente.
      # DuckDB est installe ICI seulement, version figee.
      - name: Telecharger les DECP consolidees
        id: decp
        if: always() && steps.cle.outcome == 'success'
        run: |
          pip install duckdb==1.1.3
          curl -fL --retry 3 --retry-delay 10 -o decp.parquet \
            "https://www.data.gouv.fr/api/1/datasets/r/11cea8e8-df3e-4ed1-932b-781e2635e432"
          ls -lh decp.parquet
      - name: Calculer les echeances IE
        if: always() && steps.decp.outcome == 'success'
        env:
          RADAR_IE: "1"
          RADAR_IE_DEBUG: ${{ github.event.inputs.debug || '0' }}
          RADAR_IE_DECP_FICHIER: decp.parquet
          IE_SHEET_ID: ${{ secrets.IE_SHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_FILE: service_account.json
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python echeances_ie.py
      # Tableau de bord ARISE (IE-2) : page web autonome lisant les tables
      # radar_ie_* (jamais radar_lignes). Isole de l'app Operations. Genere
      # meme en mode debug (lecture seule). Toujours apres les collecteurs.
      - name: Generer le tableau de bord ARISE
        id: dashboard
        if: always() && steps.cle.outcome == 'success'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          IE_DASHBOARD_SORTIE: public_ie
        run: python dashboard_ie.py
      - name: Conserver le tableau de bord ARISE (artefact)
        if: always() && steps.dashboard.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-arise
          path: public_ie/
          if-no-files-found: warn
          retention-days: 30
      # Publication Cloudflare Pages, PROJET SEPARE de celui des Operations
      # (radar-amarante-arise) : ARISE a sa propre URL, a placer derriere
      # Cloudflare Access comme la page Operations. Best-effort : un probleme
      # d'hebergement ne fait pas echouer la collecte (l'artefact reste dispo).
      - name: Publier le tableau de bord ARISE
        if: always() && steps.dashboard.outcome == 'success' && env.CF_TOKEN != ''
        continue-on-error: true
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public_ie --project-name=radar-amarante-arise --branch=main
